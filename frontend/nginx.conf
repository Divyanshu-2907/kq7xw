server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API is reached same-origin, so the browser needs no CORS grant and the
  # bundle needs no absolute backend URL baked into it.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed asset filenames are immutable; the entry document must never be cached
  # or a deploy would keep serving the old bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Deep links such as /?tab=replay&day=2026-01-12 are client-routed, so any
  # unmatched path has to fall through to the SPA shell rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

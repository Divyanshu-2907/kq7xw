server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed assets never change; the entry document must not be cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
